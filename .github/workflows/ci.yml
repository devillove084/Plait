name: C++

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.name }} (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan + UBSan
            preset: dev
          - name: Optimized
            preset: release
          - name: TSan
            preset: tsan

    env:
      PLAIT_LLVM_ROOT: /usr/lib/llvm-22
      PLAIT_CMAKE_ROOT: /usr

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the public LLVM 22 toolchain
        shell: bash
        run: |
          set -euo pipefail

          sudo install -d -m 0755 /usr/share/keyrings
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            --location --output "${RUNNER_TEMP}/llvm-snapshot.gpg.key" \
            https://apt.llvm.org/llvm-snapshot.gpg.key

          fingerprint="$({
            gpg --show-keys --with-colons \
              "${RUNNER_TEMP}/llvm-snapshot.gpg.key"
          } | awk -F: '$1 == "fpr" { print $10; exit }')"
          test "${fingerprint}" = "6084F3CF814B57C1CF12EFD515CF4D18AF4F7421"

          sudo gpg --dearmor --yes \
            --output /usr/share/keyrings/apt.llvm.org.gpg \
            "${RUNNER_TEMP}/llvm-snapshot.gpg.key"
          echo \
            "deb [signed-by=/usr/share/keyrings/apt.llvm.org.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" \
            | sudo tee /etc/apt/sources.list.d/apt.llvm.org.list >/dev/null

          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang-22 \
            clang-format-22 \
            clang-tidy-22 \
            libclang-rt-22-dev \
            libc++-22-dev \
            libc++abi-22-dev \
            libunwind-22-dev \
            lld-22 \
            ninja-build

      - name: Run the C++ quality gate
        run: ./build.sh check "${{ matrix.preset }}"

      - name: Verify generated tooling state
        shell: bash
        run: |
          set -euo pipefail
          test -s compile_commands.json
          git diff --exit-code

  gate:
    name: C++ gate
    if: ${{ always() }}
    needs:
      - quality
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every C++ configuration
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: test "${QUALITY_RESULT}" = success

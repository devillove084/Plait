name: Rust

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: format, lint, test, demo
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint every target as an error
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test the workspace
        run: cargo test --workspace --locked

      - name: Run the three-node TCP fusion demo
        run: cargo run -q --locked -p plait-node -- demo

      - name: Run the distributed DSA reference
        run: cargo run -q --locked -p plait-node -- dsa
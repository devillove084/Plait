[workspace]
members = [
    "crates/plait-core",
    "crates/plait-consensus",
    "crates/plait-device",
    "crates/plait-mem",
    "crates/plait-fabric",
    "crates/plait-gpu",
    "crates/plait-collective",
    "crates/plait-parallel",
    "crates/plait-rdma",
    "crates/plait-net",
    "crates/plait-node",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/devillove084/Plait"

[workspace.dependencies]
bincode = "1.3"
bytes = "1"
futures-util = { version = "0.3", features = ["sink"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["codec"] }
petgraph = "0.8"
rayon = "1"
plait-core = { path = "crates/plait-core" }
plait-consensus = { path = "crates/plait-consensus" }
plait-device = { path = "crates/plait-device" }
plait-fabric = { path = "crates/plait-fabric" }
plait-gpu = { path = "crates/plait-gpu" }
plait-collective = { path = "crates/plait-collective" }
plait-mem = { path = "crates/plait-mem" }
plait-parallel = { path = "crates/plait-parallel" }
plait-rdma = { path = "crates/plait-rdma" }
plait-net = { path = "crates/plait-net" }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Plait architecture</title>
  <desc id="desc">Three equal peers propose into an Plait ordering log. Ordered commands drive a fused runtime, which materializes tensors. Bulk bytes move between registered memory regions on a data plane.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent)"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--muted)"/>
    </marker>
  </defs>

  <text x="24" y="28" font-size="16" font-weight="600" fill="var(--fg)">Plait: one fabric, no rank 0</text>
  <text x="24" y="48" font-size="12" fill="var(--muted)">Every process can propose, recover, join, and serve snapshots.</text>

  <rect x="28" y="72" width="126" height="54" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="91" y="96" text-anchor="middle" font-size="14" font-weight="600" fill="var(--fg)">Peer A</text>
  <text x="91" y="114" text-anchor="middle" font-size="11" fill="var(--muted)">NodeId</text>

  <rect x="170" y="72" width="126" height="54" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="233" y="96" text-anchor="middle" font-size="14" font-weight="600" fill="var(--fg)">Peer B</text>
  <text x="233" y="114" text-anchor="middle" font-size="11" fill="var(--muted)">NodeId</text>

  <rect x="312" y="72" width="126" height="54" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="375" y="96" text-anchor="middle" font-size="14" font-weight="600" fill="var(--fg)">Peer C</text>
  <text x="375" y="114" text-anchor="middle" font-size="11" fill="var(--muted)">NodeId</text>

  <line x1="91" y1="126" x2="150" y2="166" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="233" y1="126" x2="233" y2="166" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="375" y1="126" x2="316" y2="166" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="28" y="170" width="410" height="150" rx="8" fill="var(--surface)" stroke="var(--accent)"/>
  <text x="46" y="196" font-size="14" font-weight="600" fill="var(--fg)">Plait ordering log</text>
  <text x="46" y="218" font-size="11" fill="var(--muted)">InstanceId = proposer + local counter</text>
  <text x="46" y="238" font-size="11" fill="var(--muted)">PreAccept / Accept / Commit, ballots</text>
  <text x="46" y="258" font-size="11" fill="var(--muted)">Dependencies + seq, SCC execution</text>
  <text x="46" y="278" font-size="11" fill="var(--muted)">Any voter may recover a stalled instance</text>
  <text x="46" y="302" font-size="11" fill="var(--success)">fast path when dependency sets agree</text>

  <line x1="438" y1="245" x2="520" y2="245" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="478" y="234" text-anchor="middle" font-size="11" fill="var(--muted)">ordered</text>

  <rect x="520" y="150" width="350" height="190" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="538" y="176" font-size="14" font-weight="600" fill="var(--fg)">Fused runtime</text>
  <text x="538" y="198" font-size="11" fill="var(--muted)">Sum · Max · Gather · TopK · OnlineSoftmax</text>
  <line x1="538" y1="210" x2="852" y2="210" stroke="var(--border)"/>
  <text x="538" y="232" font-size="11" fill="var(--fg)">Contribution arrives as a command</text>
  <text x="538" y="252" font-size="11" fill="var(--muted)">last contributor triggers local fusion</text>
  <text x="538" y="272" font-size="11" fill="var(--muted)">no separate all-reduce phase</text>
  <text x="538" y="298" font-size="11" fill="var(--success)">tensor shard materialized on every replica</text>
  <text x="538" y="322" font-size="11" fill="var(--muted)">membership changes are commands too</text>

  <rect x="560" y="52" width="270" height="66" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="576" y="76" font-size="13" font-weight="600" fill="var(--fg)">Replicated membership</text>
  <text x="576" y="96" font-size="11" fill="var(--muted)">staged learner → unanimous promotion</text>
  <text x="576" y="112" font-size="11" fill="var(--muted)">snapshot catch-up, no rank-zero join</text>
  <line x1="695" y1="118" x2="695" y2="150" stroke="var(--arrow-muted)" stroke-width="1.2" marker-end="url(#arrow-muted)"/>

  <rect x="28" y="360" width="410" height="96" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="46" y="384" font-size="13" font-weight="600" fill="var(--fg)">Registered memory data plane</text>
  <text x="46" y="404" font-size="11" fill="var(--muted)">aligned buffers · buffer pool · RegionDescriptor</text>
  <text x="46" y="422" font-size="11" fill="var(--muted)">one-sided read/write · loopback now, ibverbs next</text>
  <text x="46" y="442" font-size="11" fill="var(--warning)">large bytes stay out of consensus</text>

  <rect x="520" y="372" width="350" height="72" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="538" y="396" font-size="13" font-weight="600" fill="var(--fg)">Materialized tensor state</text>
  <text x="538" y="416" font-size="11" fill="var(--muted)">tensor key + shard + epoch + version</text>
  <text x="538" y="434" font-size="11" fill="var(--muted)">readable from any replica</text>

  <line x1="695" y1="340" x2="695" y2="372" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 520 408 L 438 408" stroke="var(--accent)" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 438 392 L 520 392" stroke="var(--accent)" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="479" y="384" text-anchor="middle" font-size="11" fill="var(--muted)">bulk</text>

  <line x1="28" y1="484" x2="872" y2="484" stroke="var(--border)"/>
  <text x="28" y="498" font-size="10" fill="var(--muted)">Control: framed TCP or a future RDMA backend · Ordered state: ordering instances · Identity: 128-bit NodeId</text>
</svg>